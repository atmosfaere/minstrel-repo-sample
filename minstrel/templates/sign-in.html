<!DOCTYPE html>
<html lang="en">

<body class="sign-in-body">
    <img src="/static/images/top2sc23.png" alt="" class="top-image">
    <div class="registration-container">
        <h1>Enter Minstrel</h1>
        <div class="entry-container">
            <p class="entry-label" id="entry-label">Email or Username:</p>
            <div class="input-container">
                <input type="text" class="registration-field" id="input" aria-label="Email or username" placeholder="" spellcheck="false">
                <button type="button" class="next-button" id="next-button">Next</button>
            </div>
        </div>
        <label for="remember-me">
            <input type="checkbox" id="remember-me" name="remember-me" checked>
            Stay logged in on this device
        </label>
        <p class="status-message"></p>
        <p><a href="#forgot-password" id="forgot-password-link">Forgot Password?</a></p>
        <p class="post-text">No account yet? <a href="#register" id="signup-link">Sign Up</a></p>
    </div>
    <img src="/static/images/bottom2sc2.png" alt="" class="bottom-image">

    <div class="social-signin-container">
        <button class="gsi-material-button" aria-label="Sign in with Google">
            <div class="gsi-material-button-state"></div>
            <div class="gsi-material-button-content-wrapper">
                <div class="gsi-material-button-icon">
                    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                        <path fill="none" d="M0 0h48v48H0z"></path>
                    </svg>
                </div>
            </div>
        </button>
        <button class="apple-signin-button" id="apple-signin-button" aria-label="Sign in with Apple">
            <img src="https://appleid.cdn-apple.com/appleid/button/logo?color=white&border_radius=50&scale=6" alt="Apple logo" class="apple-signin-img">
        </button>
    </div>

</body>
</html>
