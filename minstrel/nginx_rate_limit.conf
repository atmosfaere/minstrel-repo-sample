# Nginx rate limiting configuration for minstrelai.com

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=static:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
# Tighter zone for credential and invite endpoints to limit brute-force attempts
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
    listen 80;
    server_name minstrelai.com;
    
    # General rate limiting for all requests
    limit_req zone=general burst=10 nodelay;
    
    # Static files rate limiting
    location /static/ {
        limit_req zone=static burst=20 nodelay;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Credential and invite endpoints — tight limit to prevent brute-force
    location ~ ^/(sign-in|register|create-account|invite|third_party-sign-in) {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth check and availability endpoints
    location ~ ^/api/(auth-check|invite-check|email-availability|username-availability) {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Other dynamic endpoints
    location ~ ^/(verify|logout|ws|world-page) {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Main application
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Block common malicious patterns
    location ~* \.(php|php7|asp|aspx|jsp|cgi)$ {
        return 404;
    }
    
    # Block WordPress and common vulnerability scans
    location ~* (wp-|alfa|wso|admin-post|bypass|moon|cache-compat|ALFA_DATA|teorema|ab2g|ab2h) {
        return 404;
    }
} 