# Nginx rate limiting configuration for minstrelai.com

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
# Tighter zone for credential and invite endpoints to limit brute-force attempts
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
    listen 80;
    server_name minstrelai.com;
    limit_req_status 429;
    
    # General rate limiting for all requests
    limit_req zone=general burst=50 nodelay;
    
    # Static files rate limiting
    location /static/ {
        limit_req zone=static burst=100 nodelay;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Credential and invite endpoints — tight limit to prevent brute-force
    location ~ ^/(sign-in|register|create-account|invite|auth/) {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth check and availability endpoints
    location ~ ^/(api/auth-check|api/invite-check|email-availability|username-availability) {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # WebSocket endpoint
    location = /ws {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Other dynamic endpoints
    location ~ ^/(verify|logout|world-page) {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Main application
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Block common malicious patterns
    location ~* \.(php|php7|asp|aspx|jsp|cgi)$ {
        return 404;
    }
    
    # Block WordPress and common vulnerability scans
    location ~* (wp-|alfa|wso|admin-post|bypass|moon|cache-compat|ALFA_DATA|teorema|ab2g|ab2h) {
        return 404;
    }
} 